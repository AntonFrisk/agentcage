# Publishes a new patch version to npm on every push to main (patch bump: 0.1.0 -> 0.1.1).
# The version is the latest on npm with the patch bumped (or package.json's if that is higher), set only in CI, not committed.
# Auth: npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed.
name: Publish to npm
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: for f in bin/*.js src/*.js; do node --check "$f"; done
      - name: Bump patch version
        run: |
          LATEST=$(npm view agentcage version 2>/dev/null || echo 0.0.0)
          V=$(node -p "const [a,b,c]='$LATEST'.split('.').map(Number), next=[a,b,c+1], own=require('./package.json').version.split('.').map(Number); (own[0]-next[0]||own[1]-next[1]||own[2]-next[2]) > 0 ? own.join('.') : next.join('.')")
          npm version "$V" --no-git-tag-version
      - run: npm publish --access public
