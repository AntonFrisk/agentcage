# Publishes to npm on push to main when package.json has a version that isn't on npm yet.
# Auth: npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed.
name: Publish to npm
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: for f in bin/*.js src/*.js; do node --check "$f"; done
      - name: Skip if this version is already published
        id: check
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "agentcage@$V" version >/dev/null 2>&1; then echo "agentcage@$V already published"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --access public
